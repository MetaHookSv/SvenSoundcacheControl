name: Build Windows x86 Release
description: Build and package the SvenSoundcacheControl plugin.

outputs:
  archive-path:
    description: Absolute path to the Windows x86 7z archive.
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Build and install
      shell: cmd
      run: call scripts\build-SvenSoundcacheControl-x86-Release.bat "-DMETAHOOK_SOURCE_PATH="

    - name: Test behavior
      shell: cmd
      run: ctest --test-dir build\x86\Release -C Release --output-on-failure

    - name: Validate installed gamedata
      shell: cmd
      run: python build\x86\Release\_deps\svensoundcachecontrol_metahook-src\scripts\validate-gamedata.py install\x86\Release\svencoop\metahook\gamedata\svensoundcachecontrol --manifest scripts\manifests\svensoundcachecontrol.json

    - name: Package plugin
      id: package
      shell: pwsh
      working-directory: install/x86/Release
      run: |
        $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
        New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
        $archivePath = Join-Path $archiveDirectory 'SvenSoundcacheControl-windows-x86.7z'
        if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
          Remove-Item -LiteralPath $archivePath
        }
        & 7z a -t7z $archivePath 'svencoop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 7z t $archivePath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
